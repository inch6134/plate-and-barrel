[project]
name = "plate-and-barrel"
version = "0.1.0"
description = "Batting analytics dashboard on July 2024 San Diego Padres pitch data"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.0",
    "polars>=1.43.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
